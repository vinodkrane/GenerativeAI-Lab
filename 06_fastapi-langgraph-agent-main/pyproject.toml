[project]
name = "fastapi-langgraph-agent"
version = "0.1.0"
description = "Production FastAPI LangChain LLM Platform"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    # LangChain ecosystem
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langchain-openai==1.3.3",
    "langchain-anthropic==1.4.8",
    "langgraph==1.2.7",
    "langgraph-checkpoint==4.1.1",
    # Providers
    "openai==2.44.0",
    "anthropic==0.116.0",
    "google-genai==2.10.0",
    "langchain-google-genai==4.2.6",
    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    # Security
    "python-jose>=3.3",
    "passlib>=1.7",
    # Middleware
    "slowapi>=0.1.9",
    "structlog>=25.1",
    # Observability
    "langsmith==0.9.7",
    "opentelemetry-api",
    "opentelemetry-sdk",
    # Utilities
    "python-dotenv",
    "orjson",
    "tenacity",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
server = "uvicorn app.main:app --reload"
format = "ruff format ."
format-check = "uv run ruff format --check ."
lint = "ruff check ."
fix = "ruff check --fix ."
test = "pytest"
check = "ruff format . && ruff check . && pytest"


[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    ".venv",
    "migrations",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

ignore = [
    "E501", # line length handled by formatter
]


[tool.ruff.lint.isort]
known-first-party = [
    "app",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
